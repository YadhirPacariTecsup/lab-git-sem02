<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Campaña Antitabaco - Contacto</title>
    </head>
    <body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f8; color: #333;">
        <nav style="background-color: #2c3e50; padding: 15px; border-radius: 5px; text-align: center;">
            <a href="index.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Inicio</a>
            <a href="about.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Sobre la Campaña</a>
            <a href="contact.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Contacto</a>
        </nav>
        <main style="max-width: 600px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <h1 style="color: #2c3e50; text-align: center;">¿Necesitas Ayuda?</h1>
            <p style="text-align: center;">Déjanos tus datos y un especialista en cesación tabáquica te contactará de forma gratuita.</p>
            <form style="display: flex; flex-direction: column; gap: 15px;">
                <label style="font-weight: bold;">Nombre Completo:
                    <input type="text" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
                </label>
                <label style="font-weight: bold;">Correo Electrónico:
                    <input type="email" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
                </label>
                <label style="font-weight: bold;">Mensaje o Consulta:
                    <textarea rows="4" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                </label>
                <button type="button" style="background-color: #e74c3c; color: white; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Enviar Mensaje</button>
            </form>
        </main>
    </body>
</html>
